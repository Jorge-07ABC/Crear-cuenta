<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAES Commerce - Crear cuenta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Librería de iconos Font Awesome -->
    <link rel="stylesheet" href="all.min.css">
</head>
<body>
     <header class="header">
        <div class="logo-container">
            <div class="logo-box">
                <i class="fa-solid fa-box-open"></i>
            </div>
            <div class="logo-text">
                <h1>SAES</h1>
                <h2>COMMERCE</h2>
            </div>
        </div>
        <h1 class="subtitle">Bienvenido</h1>
    </header>

    <main class="signup-container">
        <div class="avatar-icon">
            <i class="fa-solid fa-user-tie"></i>
        </div>
               
        <h3>Crear cuenta</h3>

        <form class="signup-form">
            <P> Por favor ingrese su información personal</P>

             <!-- Campo Usuario -->
            <div class="input-group">
                <label for="Nombres">Nombres</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="text" id="usuario" placeholder="Ingrese nombres" required>
                </div>
            </div>    

            <!-- Apellidos -->
            <div class="input-group">
                <label for="Apellidos">Apellidos</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="text" id="usuario" placeholder="Ingrese Apellidos" required>
                </div>
            </div>  
            
            <!-- Cedula -->
            <div class="input-group">
                <label for="Cedula">Cedula</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="text" id="usuario" placeholder="Ingrese cedula" required>
                </div>
            </div>    

            <!-- Fecha de nacimiento -->
            <div class="input-group">
                <label for="Nacimiento">Fecha de nacimiento</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="text" id="usuario" placeholder="Ingrese Fecha de nacimiento" required>
                </div>
            </div>    




        














</body>
