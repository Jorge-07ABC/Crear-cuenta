<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAES Commerce - Crear cuenta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Librería de iconos Font Awesome -->
    <link rel="stylesheet" href="all.min.css">
</head>
<body>
     <header class="header">
        <div class="logo-container">
            <div class="logo-box">
                <i class="fa-solid fa-box-open"></i>
            </div>
            <div class="logo-text">
                <h1>SAES</h1>
                <h2>COMMERCE</h2>
            </div>
        </div>
        <h1 class="subtitle">Bienvenido</h1>
    </header>

    <main class="signup-container">
        <div class="avatar-icon">
            <i class="fa-solid fa-user-tie"></i>
        </div>
               
        <h3>Crear cuenta</h3>

         <div class="contenedor-formulario">
          <h2>Por favor ingrese su información personal</h2>
         

        <form class="signup-form">
            <P> Atencion los campos en asterisco(*)son obligatorios</P>

             <!-- Campo Usuario -->
            <div class="input-group">
                <label><span style="color: red; font-weight: bold;">*</span> Nombres</label>
                <div class="input-wrapper">
                    <input type="text" id="usuario" placeholder="Ingrese nombres" required>
                
                </div>
             </div>
             

            <!-- Apellidos -->
            <div class="input-group">
                <label><span style="color: red; font-weight: bold;">*</span> Apellidos</label>
                <div class="input-wrapper">
                    <input type="text" id="usuario" placeholder="Ingrese Apellidos" required>
                </div>
            </div>  
            
            <!-- Cedula -->
            <div class="input-group">
                <label><span style="color: red; font-weight: bold;">*</span> Cedula</label>
                <div class="input-wrapper">
                    <input type="text" id="usuario" placeholder="Ingrese cedula" required>
                </div>
            </div>    

            <!-- Fecha de nacimiento -->
            <div class="input-group">
                <label><span style="color: red; font-weight: bold;">*</span> Fecha de nacimiento</label>
                <div class="input-wrapper">
                    <input type="text" id="usuario" placeholder="Ingrese Fecha de nacimiento" required>
                </div>
            </div>   

            <a href="terminos.html" class="btn-terminos">Términos y Condiciones</a>


        <label>
          <input type="checkbox" name="terminos" class="checkbox-oculto" required>
      
          <span class="boton-terminos">
         <span class="chulito">✓</span> 
         Aceptar Términos y Condiciones
         </span>
        </label>

        <br><br>
          <button type="submit" style="padding: 10px 20px;">Continuar</button>

        </div>

 




        














</body>
